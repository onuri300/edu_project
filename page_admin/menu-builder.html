<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Menu Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/css/builder.css">
<link rel="stylesheet" href="../common/css/common.css">
<script src="../common/js/auth.js"></script>
<script src="../common/js/common.js"></script>
</head>
<body data-site-family="portal">
<header>
  <h1>메뉴 편집기</h1>
<figure class="page-art-banner" aria-hidden="true"><img class="page-art" data-page-image src="../images/menu-builder-hero.png" alt="" width="1536" height="1024" decoding="async"></figure>
  <p>여기서 만든 <strong>data.enc.js</strong> 파일을 common/data 폴더에 넣으면 됩니다. 아이디와 비밀번호가 곧 암호키이므로, 분실하면 기존 파일은 복구할 수 없습니다.</p>
</header>

<div class="wrap">

  <section>
    <h2>1. 접속 정보</h2>
    <div class="row">
      <div><label for="id">아이디</label><input id="id" type="text" autocomplete="off" spellcheck="false" value="admin"></div>
      <div><label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="new-password"></div>
      <div><label for="pw2">비밀번호 확인</label><input id="pw2" type="password" autocomplete="new-password"></div>
    </div>
    <p class="note">교육자 전원이 같은 아이디·비밀번호를 사용합니다. 비밀번호가 길수록 안전합니다(12자 이상 권장).</p>
  </section>

  <section>
    <h2>2. 사이트 이름</h2>
    <div class="row">
      <div><label for="title">제목</label><input id="title" type="text" value="자료실"></div>
      <div><label for="subtitle">부제목</label><input id="subtitle" type="text" value="교육자료 모음"></div>
    </div>
  </section>

  <section>
    <h2>3. 메뉴 구성</h2>
    <div id="cats"></div>
    <button class="add" id="addCat">+ 분류 추가</button>
  </section>

  <section>
    <h2>4. 파일 만들기</h2>
    <div class="row" style="align-items:center">
      <button class="primary" id="make" style="flex:0 0 auto">data.enc.js 내려받기</button>
      <button class="ghost" id="loadBtn" style="flex:0 0 auto">기존 파일 불러와 수정</button>
      <input type="file" id="file" accept=".js" hidden>
    </div>
    <p class="out" id="out"></p>
  </section>

</div>

<script src="../common/js/builder.js"></script>
</body>
</html>
