<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Flashcards</title>
<link rel="stylesheet" href="../common/css/pages/game/computer_quiz_flash.css">
<link rel="stylesheet" href="../common/css/common.css">
<script src="../common/js/auth.js"></script>
<script src="../common/js/common.js"></script>
</head>
<body data-site-family="game">
<div class="wrap">

  <header class="game-hero">
    <div>
      <p class="game-hero-kicker">ONURI / PLAY TOGETHER</p>
      <h1>IT 상식 플래시카드</h1>
      <p>설명을 읽고 키워드를 떠올려 보세요. 카드를 클릭하면 키워드가 나타납니다.</p>
    </div>
    <img class="page-art" data-page-image src="../images/computer-flashcards-hero.png" alt="" width="1536" height="1024">
  </header>

  <main id="studyView">
    <span class="badge" id="catBadge">전체</span>

    <div class="cat-filter" id="catFilter"></div>

    <div class="progress-row">
      <span id="progressText">1 / 10</span>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:10%"></div></div>
    </div>

    <div class="flash-study-layout">
    <div class="flash-study-main">
    <div id="cardArea">
      <div class="card-stage">
        <div class="flashcard" id="flashcard">
          <div class="face front">
            <span class="face-label">설명</span>
            <span class="face-cat" id="catLabelFront">카테고리</span>
            <div class="face-text" id="questionText">문제 텍스트</div>
            <div class="face-hint">카드를 클릭하면 키워드가 보여요</div>
          </div>
          <div class="face back">
            <span class="face-label">키워드</span>
            <span class="face-cat" id="catLabelBack">카테고리</span>
            <div class="face-text" id="answerText">정답 텍스트</div>
            <div class="face-hint">다시 클릭하면 설명으로 돌아가요</div>
          </div>
        </div>
      </div>

      <div class="judge-row">
        <button class="judge-btn correct" id="btnCorrect">✅ 정답이었어요</button>
        <button class="judge-btn wrong" id="btnWrong">❌ 틀렸어요</button>
      </div>

      <div class="nav-row">
        <button class="nav-btn" id="btnPrev">◀ 이전 문제</button>
        <button class="nav-btn" id="btnNext">다음 문제 ▶</button>
      </div>

      <div class="util-row">
        <button class="chip-btn" id="btnRandom">🔀 랜덤 출제</button>
        <button class="chip-btn" id="btnReset">🔁 처음부터</button>
      </div>


    </div>

    <div id="endArea" style="display:none;" class="end-screen">
      <h2>🎉 학습 완료!</h2>
      <p>모든 카드를 다 풀었어요</p>
      <div class="end-score" id="endScore">0 / 0</div>
      <button class="primary-btn" id="btnRestart">다시 풀기</button>
    </div>

    </div>
    <aside class="flash-results" aria-labelledby="flash-results-title">
      <h2 id="flash-results-title">학습 결과</h2>
      <div class="score-panel" aria-live="polite">
        <div class="score-box correct"><div class="num" id="scoreCorrect">0</div><div class="lbl">정답</div></div>
        <div class="score-box wrong"><div class="num" id="scoreWrong">0</div><div class="lbl">오답</div></div>
        <div class="score-box"><div class="num" id="scorePercent">0%</div><div class="lbl">정답률</div></div>
      </div>
    </aside>
    </div>
  </main>

  <div id="adminView" style="display:none;">
    <div class="admin-panel">
      <h2>➕ 새 카드 추가</h2>
      <div class="form-grid">
        <div>
          <label for="inpQuestion">문제 (키워드)</label>
          <input type="text" id="inpQuestion" placeholder="예: API">
        </div>
        <div>
          <label for="inpAnswer">정답 (설명)</label>
          <textarea id="inpAnswer" placeholder="예: 서로 다른 프로그램이 데이터를 주고받기 위한 규칙과 방법"></textarea>
        </div>
        <div class="form-row-2">
          <div>
            <label for="inpCategory">카테고리</label>
            <input type="text" id="inpCategory" placeholder="예: 개발 기초" list="catList">
            <datalist id="catList"></datalist>
          </div>
          <div></div>
        </div>
        <div class="error-msg" id="formError" style="display:none;"></div>
        <button class="primary-btn" id="btnAddCard">카드 추가하기</button>
      </div>

      <h2>📋 전체 카드 (<span id="cardCount">0</span>개)</h2>
      <div class="card-list" id="cardListArea"></div>

      <div style="margin-top:18px; display:flex; gap:10px;">
        <button class="ghost-btn" id="btnExport">내보내기(JSON 복사)</button>
        <button class="ghost-btn" id="btnResetAll">기본 데이터로 초기화</button>
      </div>
    </div>
  </div>

  <footer class="tabbar">
    <button class="tab-btn active" id="tabStudy">📖 Study Mode</button>
    <button class="tab-btn" id="tabAdmin">⚙️ Admin Mode</button>
  </footer>

</div>

<div class="toast" id="toast"></div>

<script src="../common/js/pages/game/computer_quiz_flash.js"></script>
</body>
</html>
