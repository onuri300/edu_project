<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}} · Onuri.</title><link rel="stylesheet" href="../onuri.framework/css/common.css"><link rel="stylesheet" href="../common/css/pages/ne_reader.css"><script src="../common/data/site-config.js"></script><script src="../onuri.framework/js/auth.js"></script><script src="../onuri.framework/js/common.js"></script><script src="../common/data/newsletter-data.js" defer></script><script src="../common/js/vendor/markdown-it.min.js" defer></script><script src="../common/js/pages/ne_md.js" defer></script><script src="../common/js/pages/ne_reader.js" defer></script><link rel="stylesheet" href="../onuri.framework/css/reader.css"></head>
<body class="resource-page" data-site-family="portal" data-newsletter="{{channel}}"><main>
{{hero}}
<div class="newsletter reading-page"><p id="report-status" role="status"></p><div class="newsletter-workspace reading-layout"><aside id="report-sidebar" class="report-sidebar reading-sidebar" aria-label="날짜별 뉴스레터"><label class="report-search-label">뉴스레터 검색<input id="report-search" type="search" placeholder="제목·본문 검색"></label><label class="report-search-label">발행 주기<select id="report-frequency"><option value="">전체</option><option value="daily">일일</option><option value="weekly">주간</option></select></label><p id="report-count" aria-live="polite"></p><nav id="report-list" aria-label="뉴스레터 일자별 목록"></nav><p id="report-empty" hidden>등록된 뉴스레터가 없습니다.</p></aside><div class="reading-divider"><button id="report-toggle" class="report-toggle" type="button" aria-controls="report-sidebar" aria-expanded="true" aria-label="날짜 목록 접기">‹</button></div><section id="report-reader" class="report-reader reading-content" aria-label="선택한 뉴스레터"><p id="reader-placeholder">왼쪽 목록에서 뉴스레터를 선택하세요.</p><div id="reader-content" hidden><header class="reader-heading"><p id="reader-meta"></p><h2 id="reader-title"></h2><a id="reader-download">원본 다운로드</a><p id="reader-summary"></p><div id="reader-tags" class="reader-tags"></div></header><nav id="reader-toc" class="reader-toc" aria-label="본문 목차"></nav><article id="reader-markdown" class="reader-markdown"></article><pre id="reader-text"></pre><iframe id="reader-html" title="뉴스레터 전문" sandbox=""></iframe><object id="reader-pdf" type="application/pdf" hidden><p>브라우저에서 PDF를 표시할 수 없습니다. 원본 다운로드를 이용하세요.</p></object><section id="reader-sources" class="reader-sources" aria-label="출처 및 관련 링크"></section></div></section></div></div></main></body></html>
