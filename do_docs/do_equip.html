<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>장비 매뉴얼 | Onuri</title>
  <link rel="stylesheet" href="../onuri.framework/css/common.css">
  <link rel="stylesheet" href="../onuri.framework/css/reader.css">
  <link rel="stylesheet" href="../onuri.framework/css/org-chart.css">
  <link rel="stylesheet" href="../common/css/pages/do_equip.css">
  <script src="../common/data/site-config.js"></script>
  <script src="../onuri.framework/js/auth.js"></script>
  <script src="../onuri.framework/js/common.js"></script>
  <script src="../common/js/pages/do_xml.js" defer></script>
<script src="../common/js/pages/do_reader.js" defer></script>
</head>
<body class="resource-page" data-manual="equipment">
<main>
<!-- layout:resource-hero -->
<section class="resource-hero resource-hero-compact" aria-labelledby="resource-title">
  <div class="resource-hero-copy">
    <p class="resource-hero-kicker">Class Resources</p>
    <h1 id="resource-title">장비 매뉴얼</h1>
    <p class="resource-hero-description">오누리 작업실의 용도별 장비와 사양를 확인하세요.</p>
  </div>
  <img class="page-art resource-hero-image" data-page-image src="../common/images/ne.image/ai-newsletter-hero.png" width="1536" height="1024" decoding="async" alt="">
</section>
<!-- /layout:resource-hero -->
<div class="newsletter reading-page">
  <div class="reading-layout document-reader">
    <aside id="equip-sidebar" class="reading-sidebar">
      <nav id="equip-nav" aria-label="장비">
        <button class="onuri-button staff-org-toggle" type="button" data-catalog-overview="eq-overview" aria-controls="equip-detail">한눈에 보기</button>
        <p data-tree-count role="status"></p>
        <div id="equip-tree" data-document-tree></div>
      </nav>
    </aside>
    <div class="reading-divider">
      <button id="equip-toggle" class="document-sidebar-toggle" data-document-sidebar-toggle type="button" aria-controls="equip-sidebar" aria-expanded="true" aria-label="목록 접기">‹</button>
    </div>
    <article id="equip-detail" class="reading-content" aria-labelledby="equip-title"><p id="equip-title" role="status">공통 매뉴얼을 불러오는 중입니다.</p></article>
  </div>
</div>
</main>
