<template id="equip-manual-lesson-guide">
  <section aria-labelledby="lesson-guide-rules">
    <h3 id="lesson-guide-rules">교안을 만들기 전과 마친 뒤</h3>
    <p>시작할 때 직원 명부와 이전 제작 피드백을 확인해 페이지별 담당을 정합니다. 마치면 적용한 피드백, 반영 위치, 검증 결과를 기록합니다.</p>
    <ul>
      <li>표지 바로 뒤에 전체 페이지를 채우는 요약 이미지 한 장을 배치합니다. 작업 단계마다 프로그램이나 도구를 표시하고, 별도 샘플 영역과 캘리그라피 제목·격려 문장을 넣습니다.</li>
      <li>매 장 우측 상단에 담당자의 공식 캐릭터, 이름과 역할을 넣습니다. 일부 페이지만 수정할 때도 적용합니다.</li>
      <li>실제 앱에서 검증한 화면과 설정값은 확인한 범위와 함께 기록합니다. 키링 교안에서는 마루가 선화, 강실습이 받침판, 오검수가 레진 안전 페이지를 담당합니다.</li>
    </ul>
    <p>최신 공통 지침과 누적 피드백은 개인 ChatGPT 페이지에서 직접 읽고 수정할 수 있습니다. 해당 페이지에 접근할 수 있는 계정으로 엽니다.</p>
    <p><a href="https://chatgpt.com/space/page_64c33240cb348191b56794b87b3c04bf" target="_blank" rel="noopener noreferrer">최신 교안 제작 지침과 피드백 열기</a> · <a href="../on_class/on_people.html">오누리 직원 명부</a> · <a href="?id=pg-inkscape-practice">Inkscape 키링 실습으로 돌아가기</a></p>
