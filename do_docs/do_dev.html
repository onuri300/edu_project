<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dev Manual | Onuri</title>
  <link rel="stylesheet" href="../onuri.framework/css/common.css">
  <link rel="stylesheet" href="../common/css/pages/mo_manual.css">
  <script src="../common/data/site-config.js"></script><script src="../onuri.framework/js/auth.js"></script>
  <script src="../onuri.framework/js/common.js"></script>
  <script src="../common/js/vendor/markdown-it.min.js" defer></script>
  <script src="../common/js/pages/ne_md.js" defer></script>
  <script src="../common/data/coding-manual.js" defer></script>
  <script src="../common/js/pages/mo_sample.js" defer></script>
  <script src="../common/js/pages/mo_schema.js" defer></script>
  <script src="../common/js/pages/mo_manual.js" defer></script>
  <link rel="stylesheet" href="../onuri.framework/css/reader.css">
</head>
<body class="resource-page" data-site-family="gpt-making-manual" data-manual="coding">
  <main>
<!-- layout:resource-hero -->
<section class="resource-hero resource-hero-compact" aria-labelledby="resource-title">
  <div class="resource-hero-copy">
    <p class="resource-hero-kicker">ONURI / DEVELOPER GUIDE</p>
    <h1 id="resource-title">Dev Manual</h1>
    <p class="resource-hero-description">프로젝트 구조, 공통 프레임워크, API와 페이지 개발 규칙을 확인하세요.</p>
  </div>
  <img class="page-art resource-hero-image" data-page-image src="../common/images/ne.image/ai-newsletter-hero.png" width="1536" height="1024" decoding="async" alt="">
</section>
<!-- /layout:resource-hero -->
    <div class="resource-content manual surface-controls reading-page">


    <div class="manual-workspace reading-layout">
      <aside id="manual-sidebar" class="manual-sidebar reading-sidebar">
    <div class="manual-filters">
      <label>키워드 검색 <input id="manual-search" type="search" placeholder="예: 배포, Supabase"></label>
      <label>카테고리 <select id="manual-category"><option value="">전체</option></select></label>
    </div>
        <div class="manual-tree-toolbar"><p id="manual-status" role="status">매뉴얼을 불러오는 중입니다.</p><div class="manual-tree-actions" role="group" aria-label="문서 트리 전체 제어"><button id="manual-expand-all" type="button" aria-label="전체 펼치기" title="전체 펼치기">+</button><button id="manual-collapse-all" type="button" aria-label="전체 접기" title="전체 접기">−</button></div></div>
      <nav id="manual-list" aria-label="개발 문서 목록"></nav>
      </aside>
      <div class="manual-divider reading-divider"><button id="manual-sidebar-toggle" class="manual-sidebar-toggle" type="button" aria-controls="manual-sidebar" aria-expanded="true" aria-label="문서 목록 접기">←</button></div>
      <article id="manual-detail" class="manual-detail reading-content" hidden>
        <header class="manual-detail-heading">
        <p class="manual-kicker" id="manual-keyword"></p>
        <h2 id="manual-title"></h2>
        <p id="manual-description"></p>
        </header>
        <div id="manual-sample" class="manual-sample" hidden></div>
        <section id="manual-schema" class="manual-schema" hidden aria-label="운영 데이터베이스 스키마"></section>
        <div class="manual-prompt">
          <div class="manual-prompt-heading"><button id="manual-copy" type="button">본문 복사</button></div>
          <div id="manual-prompt" class="manual-document"></div>
          <p id="manual-copy-status" role="status"></p>
        </div>
        <dl id="manual-notes"></dl>
      </article>
    </div>
    </div>
</main>
</body>
</html>
