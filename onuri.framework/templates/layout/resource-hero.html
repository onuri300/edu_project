<section class="resource-hero{{variant}}" aria-labelledby="resource-title">
  <div class="resource-hero-copy">
    <p class="resource-hero-kicker">{{eyebrow}}</p>
    <h1 id="resource-title">{{title}}</h1>
    <p class="resource-hero-description">{{description}}</p>{{topics}}
  </div>
  <img class="page-art resource-hero-image" data-page-image src="{{image}}" width="{{width}}" height="{{height}}" decoding="async" alt="{{imageAlt}}">
</section>
