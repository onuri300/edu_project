<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>자료실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common/css/index.css">
<link rel="stylesheet" href="common/css/common.css">
<script src="common/js/auth.js"></script>
<script src="common/js/common.js"></script>
</head>
<body data-site-family="portal">
<!-- 로그인 -->
<div id="gate">
  <div class="gate-box">
    <div class="login-art"><img class="page-art" data-page-image src="images/index-hero.png" alt="" width="1536" height="1024" decoding="async"></div>
    <h2 class="gate-title">자료실</h2>
    <p class="gate-sub">발급받은 아이디와 비밀번호를 입력하세요.</p>
    <div class="field">
      <label for="uid">아이디</label>
      <input id="uid" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="아이디">
    </div>
    <div class="field">
      <label for="upw">비밀번호</label>
      <input id="upw" type="password" autocomplete="off" placeholder="비밀번호">
    </div>
    <button id="enter">들어가기</button>
    <p id="gate-msg" role="status" aria-live="polite"></p>
  </div>
</div>

<!-- 본문 -->
<div id="app">
  <header id="topbar">
    <button class="icon-btn" id="burger" aria-label="메뉴 열기">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <strong id="topTitle">자료실</strong>
  </header>

  <div id="scrim"></div>

  <button id="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="왼쪽 메뉴 접기">‹</button>
  <aside id="sidebar">
    <div class="brand">
      <h1 id="brandName">자료실</h1>
      <p id="brandSub">교육자료 모음</p>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button id="logout">로그아웃</button>
    </div>
  </aside>

  <main>
    <div class="crumb">
      <h2 id="crumbTitle">시작하기</h2>
      <span id="crumbSub">왼쪽에서 메뉴를 선택하세요</span>
      <span class="spacer"></span>
      <button class="ghost" id="openNew" hidden>새 탭에서 열기</button>
    </div>
    <div class="stage">
      <div class="welcome" id="welcome">
        <div class="welcome-art"><img class="page-art" data-page-image src="images/index-hero.png" alt="" width="1536" height="1024" decoding="async"></div>
        <h3>메뉴를 선택하면 자료가 여기에 열립니다</h3>
        <p>왼쪽 목록에서 분류를 누르면 하위 항목이 펼쳐집니다. 항목을 누르면 자료가 이 화면 안에서 바로 열립니다.</p>
        <p>화면 안에서 열리지 않는 자료는 오른쪽 위 ‘새 탭에서 열기’를 눌러 보세요.</p>
      </div>
      <iframe id="frame" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads" title="자료 보기"></iframe>
    </div>
  </main>
</div>

<!-- 암호화된 메뉴 데이터 (menu-builder.html 로 생성) -->
<script src="common/data/data.enc.js"></script>

<script src="common/js/resource-policy.js"></script>
<script src="common/js/index.js"></script>
</body>
</html>
