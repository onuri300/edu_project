<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>자료실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common/css/index.css">
<link rel="stylesheet" href="common/css/common.css">
<script src="common/js/auth.js"></script>
<script src="common/js/common.js"></script>
</head>
<body data-site-family="portal">
<!-- 로그인 -->
<div id="gate">
  <div class="gate-box">
    <div class="login-art"><img class="page-art" data-page-image src="images/index-hero.png" alt="" width="1536" height="1024" decoding="async"></div>
    <span class="login-eyebrow">WELCOME TO ONURI</span><h2 class="gate-title">배움의 시작, Onuri.</h2>
    <p class="gate-sub">아이디와 비밀번호로 나만의 배움 공간에 들어오세요.</p>
    <div class="field">
      <label for="uid">아이디</label>
      <input id="uid" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="아이디">
    </div>
    <div class="field">
      <label for="upw">비밀번호</label>
      <input id="upw" type="password" autocomplete="off" placeholder="비밀번호">
    </div>
    <button id="enter">시작하기</button>
    <p id="gate-msg" role="status" aria-live="polite"></p>
  </div>
</div>

<!-- 본문 -->
<div id="app">
  <header id="topbar">
    <button class="icon-btn" id="burger" aria-label="메뉴 열기">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <strong id="topTitle">자료실</strong>
  </header>

  <div id="scrim"></div>

  <button id="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="왼쪽 메뉴 접기">‹</button>
  <aside id="sidebar">
    <div class="brand">
      <h1 id="brandName">자료실</h1>
      <p id="brandSub">교육자료 모음</p>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button id="logout">로그아웃</button>
    </div>
  </aside>

  <main>
    <div class="crumb">
      <h2 id="crumbTitle">시작하기</h2>
      <span id="crumbSub">왼쪽에서 메뉴를 선택하세요</span>
      <span class="spacer"></span>
      <button class="ghost" id="openNew" hidden>새 탭에서 열기</button>
    </div>
    <div class="stage">
      <div class="welcome" id="welcome">
        <section class="home-hero"><div class="home-copy"><span class="home-eyebrow">ONURI · LEARN &amp; MAKE</span><h3>생각을 배우고,<br>직접 만드는 즐거움.</h3><p>수업 자료부터 새로운 기술의 이야기까지.<br>배움과 만들기를 이어주는 공간, Onuri.</p><a class="home-explore" href="#home-collections">콘텐츠 둘러보기 <span aria-hidden="true">↓</span></a></div><div class="welcome-art"><img class="page-art" data-page-image src="images/index-hero.png" alt="배움과 만들기의 도구가 어우러진 일러스트" width="1536" height="1024" decoding="async"></div></section>
        <section id="home-collections" class="home-collections"><div class="home-section-heading"><div><span class="home-eyebrow">EXPLORE THE COLLECTION</span><h3>오늘은 무엇을 만나볼까요?</h3></div><p>관심 있는 콘텐츠부터 가볍게 시작하세요.</p></div><div id="home-categories" class="home-category-grid"></div></section>
        <footer class="home-footer"><strong>Onuri.</strong><span>작은 호기심이 새로운 배움이 되는 곳.</span></footer>
      </div>
      <iframe id="frame" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads" title="자료 보기"></iframe>
    </div>
  </main>
</div>

<!-- 암호화된 메뉴 데이터 (menu-builder.html 로 생성) -->
<script src="common/data/data.enc.js"></script>

<script src="common/js/resource-policy.js"></script>
<script src="common/js/index.js"></script>
</body>
</html>
