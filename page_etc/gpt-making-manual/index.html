<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPT Making Manual | Onuri</title>
  <link rel="stylesheet" href="../../common/css/common.css">
  <link rel="stylesheet" href="../../common/css/pages/gpt-making-manual.css">
  <script src="../../common/js/auth.js"></script>
  <script src="../../common/js/common.js"></script>
  <script src="../../common/js/pages/gpt-making-manual.js" defer></script>
</head>
<body data-site-family="gpt-making-manual">
  <main class="manual surface-controls">
    <header class="manual-intro">
      <p class="manual-kicker">ONURI / PROMPT LIBRARY</p>
      <h1>GPT Making Manual</h1>
      <p>출력 형식, 이미지 가공, 교안 제작, 실무에 쓸 프롬프트를 찾아보세요.</p>
    </header>
    <div class="manual-filters">
      <label>키워드 검색 <input id="manual-search" type="search" placeholder="예: 수업안, 인포그래픽"></label>
      <label>카테고리 <select id="manual-category"><option value="">전체</option></select></label>
    </div>
    <p id="manual-status" role="status">매뉴얼을 불러오는 중입니다.</p>
    <div class="manual-workspace">
      <nav id="manual-list" aria-label="프롬프트 목록"></nav>
      <article id="manual-detail" class="manual-detail surface-panel" hidden>
        <p class="manual-kicker" id="manual-keyword"></p>
        <h2 id="manual-title"></h2>
        <p id="manual-description"></p>
        <div class="manual-prompt">
          <div class="manual-prompt-heading"><h3>사용 예시</h3><button id="manual-copy" type="button">프롬프트 복사</button></div>
          <pre id="manual-prompt"></pre>
          <p id="manual-copy-status" role="status"></p>
        </div>
        <dl id="manual-notes"></dl>
      </article>
    </div>
  </main>
</body>
</html>
